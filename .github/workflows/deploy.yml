name: Deploy to Snowflake (schemachange)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install schemachange
        run: pip install schemachange==4.3.3

      - name: Debug key file
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          printenv SNOWFLAKE_PRIVATE_KEY | tr -d '\r' > /tmp/rsa_key.p8
          echo "File size: $(wc -c < /tmp/rsa_key.p8) bytes"
          echo "Line count: $(wc -l < /tmp/rsa_key.p8)"
          echo "First line: $(head -1 /tmp/rsa_key.p8)"
          echo "Last line: $(tail -1 /tmp/rsa_key.p8)"
          rm -f /tmp/rsa_key.p8

      - name: Deploy migrations
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          printenv SNOWFLAKE_PRIVATE_KEY | tr -d '\r' > /tmp/rsa_key.p8
          schemachange deploy \
            --snowflake-private-key-path /tmp/rsa_key.p8
          rm -f /tmp/rsa_key.p8

      - name: Verify deployment
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          printenv SNOWFLAKE_PRIVATE_KEY | tr -d '\r' > /tmp/rsa_key.p8
          schemachange deploy \
            --snowflake-private-key-path /tmp/rsa_key.p8 \
            --dry-run
          rm -f /tmp/rsa_key.p8
